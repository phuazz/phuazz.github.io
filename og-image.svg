<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source of truth for og-image.png (the social share card on index.html and
  dashboards.html). Edit this file, then regenerate the PNG with:

      python scripts/render_og.py

  Strap and all other copy must stay count-free — no dashboard counts, no
  asset-class counts. Palette and type mirror the hub pages (dashboards.html
  :root tokens); the mark mirrors the nav-mark SVG there.
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zhenghao Phua, CFA — systematic, rules-based investment dashboards">
  <title>Zhenghao Phua, CFA — systematic, rules-based investment dashboards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
    :root {
      --ink:  #1a1a18;  /* --fg   */
      --grey: #5c5c56;  /* --fg2  */
      --body: #4a4a44;  /* strap tone, between --fg and --fg2 */
      --ac:   #1a6b42;  /* --ac   */
      --gd:   #b8963e;  /* --gd   */
      --card: #fcfbf7;
      --bd:   #e2e0d8;  /* --bd   */
    }
    .eyebrow     { font: 700 14px 'DM Sans', -apple-system, sans-serif; letter-spacing: 3px; fill: var(--ac); }
    .name        { font: 600 32px 'Newsreader', Georgia, serif; letter-spacing: -0.3px; fill: var(--ink); }
    .name-suffix { font: 400 28px 'Newsreader', Georgia, serif; fill: var(--grey); }
    .headline    { font: 500 58px 'Newsreader', Georgia, serif; letter-spacing: -0.5px; fill: var(--ink); }
    .headline-em { font: italic 500 58px 'Newsreader', Georgia, serif; letter-spacing: -0.5px; fill: var(--ac); }
    .strap       { font: 500 26px 'DM Sans', -apple-system, sans-serif; fill: var(--body); }
    .url         { font: 500 19px 'JetBrains Mono', Consolas, monospace; letter-spacing: 1.5px; fill: var(--ac); }
  </style>

  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f3ef"/>
      <stop offset="1" stop-color="#edf1ec"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="0.85" cy="0.10" r="0.75">
      <stop offset="0" stop-color="#dcebe0"/>
      <stop offset="1" stop-color="#dcebe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0.10" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#e0eee4"/>
      <stop offset="1" stop-color="#e0eee4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft green-tinted ground behind the card -->
  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#glowTR)"/>
  <rect width="1200" height="630" fill="url(#glowBL)"/>

  <!-- Cream card -->
  <rect x="20" y="20" width="1160" height="590" rx="22" fill="var(--card)" stroke="var(--bd)" stroke-width="1"/>

  <!-- Mark: geometry identical to the nav-mark in dashboards.html -->
  <svg x="92" y="70" width="56" height="56" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="var(--ac)"/>
    <path d="M7 21.5 L13 15.5 L18 19 L25 9.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="9.5" r="2.5" fill="var(--gd)"/>
  </svg>

  <text class="eyebrow" x="172" y="97">SYSTEMATIC INVESTMENT RESEARCH</text>
  <text x="170" y="134"><tspan class="name">Zhenghao Phua</tspan><tspan class="name-suffix">, CFA</tspan></text>

  <text class="headline" x="90" y="312">Rules-based strategies —</text>
  <text class="headline-em" x="90" y="382">backtested, not asserted.</text>
  <rect x="92" y="410" width="130" height="4" rx="2" fill="var(--gd)"/>

  <text class="strap" x="92" y="474">Interactive, rules-based dashboards · systematic, backtested, open</text>

  <text class="url" x="92" y="561">phuazz.github.io</text>

  <!-- Sparkline, rising left to right, gold end-dot -->
  <polyline points="812,556 854,542 888,551 932,512 964,521 1010,492 1032,500 1090,468"
            fill="none" stroke="var(--ac)" stroke-opacity="0.55" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1090" cy="468" r="5" fill="var(--gd)"/>
</svg>
