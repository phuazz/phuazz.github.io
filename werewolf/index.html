<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Werewolf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --card:#18213f; --card2:#1f2a50; --line:#2c3a6b;
  --text:#e9ecf8; --muted:#97a1c7; --accent:#c9a2ff; --accent2:#8f6bff;
  --wolf:#ff5c6c; --good:#53d6a0; --warn:#ffcc66; --radius:16px;
}
body.day{
  --bg:#2a1d10; --bg2:#3a2814; --card:#4a331a; --card2:#5a3f20; --line:#7a5a30;
  --text:#fff6e8; --muted:#e0c49c; --accent:#ffc861; --accent2:#ff9f40;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,var(--bg2),var(--bg));color:var(--text);transition:background .8s,color .8s;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1,h2,h3{font-family:Cinzel,serif;letter-spacing:.04em;margin:0}
h1{font-size:40px;font-weight:800;text-align:center}
h2{font-size:22px;margin-bottom:10px}
h3{font-size:16px;margin-bottom:8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;font-family:inherit}
input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
button{font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:12px;padding:13px 16px;cursor:pointer;color:var(--text);background:var(--card2);border:1px solid var(--line)}
button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#120a24;border:none}
body.day button.primary{color:#2a1500}
button.danger{background:#5a1f2a;border-color:#8a3040}
button.ghost{background:transparent}
button.block{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
button.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:6px 0}
button.pick.sel{outline:2px solid var(--accent);background:var(--card2)}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.wolf{color:var(--wolf);border-color:var(--wolf)}
.tag.good{color:var(--good);border-color:var(--good)}
.bigcode{font-family:Cinzel,serif;font-size:54px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--accent)}
.moon{font-size:56px;text-align:center;margin-top:10px}
.phase{display:flex;justify-content:space-between;align-items:center}
.phase .title{font-family:Cinzel,serif;font-size:24px;font-weight:800}
.banner{background:var(--card2);border-left:4px solid var(--accent);padding:12px 14px;border-radius:10px;margin:12px 0;line-height:1.45}
.err{background:#4a1520;border:1px solid #a03040;padding:12px 14px;border-radius:12px;margin:12px 0;display:flex;gap:10px;align-items:flex-start}
.rolecard{text-align:center;cursor:pointer;user-select:none}
.rolecard .icon{font-size:56px}
.rolecard .name{font-family:Cinzel,serif;font-size:26px;font-weight:800;margin-top:4px}
.players .p{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.players .p:last-child{border-bottom:none}
.dead{opacity:.45;text-decoration:line-through}
.hostbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.hostbar .inner{max-width:560px;margin:0 auto}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;padding:0}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.switch{width:52px;height:30px;border-radius:99px;background:var(--bg);border:1px solid var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--accent2)}
.switch.on::after{left:25px;background:#fff}
.log div{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.timer{font-family:Cinzel,serif;font-size:30px;text-align:center;font-weight:800}
.modtable{width:100%;border-collapse:collapse;font-size:14px}
.modtable td{padding:7px 4px;border-bottom:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.sheet li{margin:6px 0;line-height:1.45}
.result{font-size:18px;text-align:center;padding:14px;border-radius:12px;background:var(--bg)}
</style>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================
   Werewolf — same-room party game, one phone per player.
   The host's phone runs the game; other phones connect to it
   directly (WebRTC via PeerJS). No accounts, no database.
   ========================================================= */
const ROLE = {
  wolf:{name:"Werewolf",icon:"🐺",team:"wolves",art:"a Werewolf",desc:"Each night, agree with the other werewolves on one player to kill. By day, blend in with the villagers."},
  seer:{name:"Seer",icon:"🔮",team:"village",art:"the Seer",desc:"Each night, inspect one player and learn whether they are a werewolf."},
  doctor:{name:"Doctor",icon:"💉",team:"village",art:"the Doctor",desc:"Each night, protect one player from the werewolves. You may protect yourself, but not the same player two nights in a row."},
  villager:{name:"Villager",icon:"🧑‍🌾",team:"village",art:"a Villager",desc:"You have no night power. Find the werewolves through discussion and vote them out by day."}
};
const MIN_PLAYERS = 4, MAX_PLAYERS = 16;
const PEER_PREFIX = "zhwerewolf-v1-";

/* ---------------- state ---------------- */
const S = {
  pid:null, name:"", codeInput:"", code:null,
  isHost:false, peer:null, conn:null, conns:{}, connected:false, reconnecting:false,
  game:null, hostGame:null, hs:null, inbox:null, nightPick:null,
  resolveTimer:null, voteTimer:null, wakeLock:null,
  showRole:false, showRules:false, showLog:false, err:"", busy:false, voiceOn:true, status:""
};

/* ---------------- helpers ---------------- */
const LS = {
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = n => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
const rid = () => Array.from({length:12},()=>"abcdefghijkmnpqrstuvwxyz23456789"[rnd(32)]).join("");
const randCode = () => Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[rnd(24)]).join("");
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
function plurality(arr, randomTie){
  const c={}; arr.forEach(x=>{c[x]=(c[x]||0)+1});
  let max=0, top=[];
  for(const [k,v] of Object.entries(c)){ if(v>max){max=v;top=[k]} else if(v===max) top.push(k); }
  if(!top.length) return null;
  if(top.length===1) return top[0];
  return randomTie ? top[rnd(top.length)] : null;
}
function defaultWolves(n){ return n<=6?1:(n<=11?2:3); }
function nameOf(id){ const p=(S.game&&S.game.players||[]).find(x=>x.id===id); return p?p.name:"?"; }
function narrate(text){
  if(!S.voiceOn || !S.isHost) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.rate=.95; u.pitch=.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
async function keepAwake(){
  try{ if(navigator.wakeLock && !S.wakeLock){ S.wakeLock = await navigator.wakeLock.request("screen"); S.wakeLock.addEventListener("release",()=>{S.wakeLock=null;}); } }catch(e){}
}
function peerOk(){ return typeof window.Peer === "function"; }
function peerErrorText(err){
  const t = err && err.type;
  if(t==="peer-unavailable") return "No game found with code "+S.code+". Check the code, and make sure the host still has the game open.";
  if(t==="unavailable-id") return "That room is still being released. Try again in a moment.";
  if(t==="network" || t==="server-error" || t==="socket-error" || t==="socket-closed") return "Cannot reach the connection server. Check your internet connection.";
  if(t==="browser-incompatible") return "This browser cannot run the game. Try a recent Chrome or Safari.";
  return "Connection problem"+(t?" ("+t+")":"")+". Try again.";
}

/* ---------------- startup ---------------- */
(function init(){
  S.pid = LS.get("ww:pid"); if(!S.pid){ S.pid = "p"+rid(); LS.set("ww:pid", S.pid); }
  S.name = LS.get("ww:name") || "";
  const h=(location.hash||"").slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(h)) S.codeInput=h;
  render();
})();

/* =========================================================
   HOST
   ========================================================= */
function saveHost(){ if(S.isHost && S.hostGame) LS.set("ww:host", {code:S.code, game:S.hostGame, hs:S.hs, at:Date.now()}); }

function createGame(mode){
  if(!peerOk()){ S.err="The connection library did not load. Check your internet connection and reload."; render(); return; }
  if(!S.name.trim()){ S.err="Enter your name first."; render(); return; }
  const code = randCode();
  const g = {
    code, host:S.pid, hostName:S.name.trim(), mode, status:"lobby", round:0, gameId:rid(),
    players: mode==="app" ? [{id:S.pid, name:S.name.trim(), alive:true}] : [],
    config:{ wolves:1, wolvesAuto:true, seer:true, doctor:true, reveal:true },
    log:[], nightIn:[], votes:{}, timerEnd:null, winner:null, announce:"", updatedAt:Date.now()
  };
  S.hs = { gameId:g.gameId, roles:{}, actions:{}, seer:[], lastProtected:null };
  S.voiceOn = mode==="app";
  openHostPeer(code, g, true);
}
function resumeHost(){
  const saved = LS.get("ww:host"); if(!saved) return;
  if(!peerOk()){ S.err="The connection library did not load. Check your internet connection and reload."; render(); return; }
  S.hs = saved.hs; S.voiceOn = saved.game.mode==="app";
  openHostPeer(saved.code, saved.game, false);
}
function openHostPeer(code, game, fresh, attempt){
  attempt = attempt||0;
  S.busy=true; S.status = fresh ? "Creating room…" : "Reopening room "+code+"…"; render();
  const peer = new Peer(PEER_PREFIX+code);
  peer.on("open", ()=>{
    S.peer=peer; S.code=code; S.isHost=true; S.connected=true; S.busy=false; S.status="";
    S.hostGame=game; S.game=game; S.conns={};
    try{ location.hash=code; }catch(e){}
    saveHost(); keepAwake(); refreshHostView(); render();
  });
  peer.on("connection", conn=>{
    conn.on("data", d=>onHostMsg(conn, d));
    conn.on("close", ()=>{ if(conn.pid && S.conns[conn.pid]===conn){ delete S.conns[conn.pid]; render(); } });
    conn.on("error", ()=>{});
  });
  peer.on("disconnected", ()=>{ // lost the signalling server; existing player links keep working
    setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} }, 1500);
  });
  peer.on("error", err=>{
    if(err.type==="unavailable-id"){
      try{ peer.destroy(); }catch(e){}
      if(fresh && attempt<6){ const c=randCode(); game.code=c; return openHostPeer(c, game, true, attempt+1); }
      if(!fresh && attempt<20){ S.status="Waiting for room "+code+" to free up ("+(attempt+1)+")…"; render(); return setTimeout(()=>openHostPeer(code, game, false, attempt+1), 3000); }
    }
    if(!S.isHost){ try{ peer.destroy(); }catch(e){} S.busy=false; S.status=""; S.err=peerErrorText(err); render(); }
  });
}
function send(conn, msg){ try{ if(conn && conn.open) conn.send(msg); }catch(e){} }

function onHostMsg(conn, d){
  if(!d || typeof d!=="object") return;
  const g=S.hostGame;
  if(d.t==="join"){
    const pid=String(d.pid||"").slice(0,40), name=String(d.name||"").trim().slice(0,24);
    if(!pid || !name) return;
    const existing = g.players.find(p=>p.id===pid);
    if(!existing){
      if(g.status!=="lobby") return send(conn,{t:"reject", msg:"This game has already started. Wait for the next round."});
      if(g.players.length>=MAX_PLAYERS) return send(conn,{t:"reject", msg:"This room is full."});
      g.players.push({id:pid, name, alive:true});
      if(g.config.wolvesAuto) g.config.wolves = defaultWolves(g.players.length);
    } else if(g.status==="lobby"){ existing.name = name; }
    const old=S.conns[pid]; if(old && old!==conn){ try{ old.close(); }catch(e){} }
    conn.pid=pid; S.conns[pid]=conn;
    changed();
    return;
  }
  const pid=conn.pid; if(!pid) return;
  if(d.t==="night") handleNight(pid, d);
  else if(d.t==="vote") handleVote(pid, d);
  else if(d.t==="leave"){
    if(g.status==="lobby"){ g.players=g.players.filter(p=>p.id!==pid); if(g.config.wolvesAuto) g.config.wolves=defaultWolves(g.players.length); }
    delete S.conns[pid]; changed();
  }
}

/* every state change goes through here: save, refresh own view, send each player their view */
let bcastTimer=null;
function changed(){
  S.hostGame.updatedAt=Date.now();
  saveHost(); refreshHostView(); render();
  clearTimeout(bcastTimer); bcastTimer=setTimeout(broadcast, 30);
}
function publicGame(){ const g=S.hostGame; return {...g}; }
function privView(pid){
  const g=S.hostGame, hs=S.hs, role=hs.roles[pid];
  if(!role || g.status==="lobby") return null;
  const A=hs.actions[g.round]||{};
  const v={gameId:hs.gameId, role, round:g.round, mine:A[pid]?A[pid].target:null};
  if(role==="wolf"){
    v.wolves=g.players.filter(p=>hs.roles[p.id]==="wolf").map(p=>p.id);
    v.picks={}; g.players.filter(p=>p.alive && hs.roles[p.id]==="wolf" && A[p.id]).forEach(p=>v.picks[p.id]=A[p.id].target);
  }
  if(role==="seer") v.seer=hs.seer;
  if(role==="doctor") v.lastProtected=hs.lastProtected;
  return v;
}
function refreshHostView(){ S.game=S.hostGame; S.inbox=privView(S.pid); }
function broadcast(){
  const pub=publicGame();
  for(const [pid,conn] of Object.entries(S.conns)) send(conn,{t:"state", game:pub, me:privView(pid)});
}

/* ---------------- rules engine (host only) ---------------- */
function validTarget(role, me, t){
  const g=S.hostGame, hs=S.hs;
  if(role==="villager" && t==null) return true;
  const p=g.players.find(x=>x.id===t);
  if(!p || !p.alive) return false;
  if(role==="wolf") return hs.roles[t]!=="wolf";
  if(role==="seer") return t!==me;
  if(role==="doctor") return t!==hs.lastProtected;
  if(role==="villager") return t!==me;
  return false;
}
function handleNight(pid, d){
  const g=S.hostGame, hs=S.hs;
  if(g.status!=="night" || d.round!==g.round || d.gameId!==g.gameId) return;
  const me=g.players.find(p=>p.id===pid); if(!me || !me.alive) return;
  const role=hs.roles[pid]; const target = d.target==null?null:String(d.target);
  if(!validTarget(role, pid, target)) return;
  const A = hs.actions[g.round] = hs.actions[g.round] || {};
  if(role==="seer" && A[pid]) return;  // seer's choice is final
  A[pid]={target};
  if(role==="seer") hs.seer.push({round:g.round, target, wolf:hs.roles[target]==="wolf"});
  g.nightIn = g.players.filter(p=>p.alive && A[p.id]).map(p=>p.id);
  changed();
  if(g.mode==="app" && nightReady() && !S.resolveTimer){
    const r=g.round;
    S.resolveTimer=setTimeout(()=>{ S.resolveTimer=null; if(S.hostGame.status==="night" && S.hostGame.round===r && nightReady()) resolveNight(); }, 2500);
  }
}
function nightReady(){
  const g=S.hostGame, hs=S.hs, A=hs.actions[g.round]||{};
  const living=g.players.filter(p=>p.alive);
  if(!living.every(p=>A[p.id])) return false;
  return new Set(living.filter(p=>hs.roles[p.id]==="wolf").map(w=>A[w.id].target)).size<=1;
}
function wolfPicks(){
  const g=S.hostGame, hs=S.hs, A=hs.actions[g.round]||{};
  return g.players.filter(p=>p.alive && hs.roles[p.id]==="wolf").map(p=>A[p.id]&&A[p.id].target).filter(Boolean);
}
function resolveNight(){
  const g=S.hostGame, hs=S.hs, r=g.round, A=hs.actions[r]||{};
  if(g.status!=="night") return;
  const victim = plurality(wolfPicks(), true);
  const doc = g.players.find(p=>p.alive && hs.roles[p.id]==="doctor");
  const saved = doc && A[doc.id] ? A[doc.id].target : null;
  hs.lastProtected = saved || null;
  let text;
  if(victim && victim!==saved){
    const v=g.players.find(p=>p.id===victim); v.alive=false;
    if(g.config.reveal) v.role=hs.roles[victim];
    text="Night "+r+": "+v.name+" was killed by the werewolves"+(g.config.reveal?" (they were "+ROLE[hs.roles[victim]].art+")":"")+".";
  } else text="Night "+r+": The village wakes up and nobody has died.";
  Object.assign(g,{status:"day", nightIn:[], votes:{}, timerEnd:null, announce:text});
  g.log.push({r,k:"night",t:text});
  narrate("Morning comes. "+text.replace(/^Night \d+: /,""));
  checkWin(); changed();
}
function handleVote(pid, d){
  const g=S.hostGame;
  if(g.status!=="vote" || d.round!==g.round || d.gameId!==g.gameId) return;
  const me=g.players.find(p=>p.id===pid); if(!me || !me.alive) return;
  const t=String(d.target);
  const tp=g.players.find(p=>p.id===t);
  if(t!=="skip" && (!tp || !tp.alive || t===pid)) return;
  g.votes={...g.votes, [pid]:t};
  changed();
  const living=g.players.filter(p=>p.alive);
  if(g.mode==="app" && living.every(p=>g.votes[p.id]) && !S.voteTimer){
    S.voteTimer=setTimeout(()=>{ S.voteTimer=null; const G=S.hostGame; if(G.status==="vote" && G.players.filter(p=>p.alive).every(p=>G.votes[p.id])) resolveVote(); }, 2500);
  }
}
function resolveVote(){
  const g=S.hostGame, hs=S.hs; if(g.status!=="vote") return;
  const votes=g.votes||{};
  const out=plurality(Object.values(votes), false);
  let text;
  if(!out || out==="skip"){
    text="Day "+g.round+": "+(Object.keys(votes).length?"The vote was tied or skipped.":"Nobody voted.")+" Nobody was eliminated.";
  } else {
    const v=g.players.find(p=>p.id===out); v.alive=false;
    if(g.config.reveal) v.role=hs.roles[out];
    text="Day "+g.round+": The village voted out "+v.name+(g.config.reveal?" (they were "+ROLE[hs.roles[out]].art+")":"")+".";
  }
  const detail=Object.entries(votes).map(([a,b])=>nameOf(a)+" → "+(b==="skip"?"skip":nameOf(b))).join(", ");
  Object.assign(g,{status:"dusk", votes:{}, timerEnd:null, announce:text});
  g.log.push({r:g.round,k:"vote",t:text,d:detail});
  narrate(text.replace(/^Day \d+: /,""));
  checkWin(); changed();
}
function checkWin(){
  const g=S.hostGame, hs=S.hs; const living=g.players.filter(p=>p.alive);
  const w=living.filter(p=>hs.roles[p.id]==="wolf").length, o=living.length-w;
  let winner=null; if(w===0) winner="village"; else if(w>=o) winner="wolves";
  if(!winner) return false;
  const t = winner==="village"?"The village wins! Every werewolf has been found.":"The werewolves win! They now equal or outnumber the villagers.";
  g.players.forEach(p=>p.role=hs.roles[p.id]);
  Object.assign(g,{status:"over", winner, announce:t});
  g.log.push({r:g.round,k:"end",t});
  setTimeout(()=>narrate(t), 2500);
  return true;
}
function setupError(){
  const g=S.hostGame; const n=g.players.length, c=g.config;
  if(n<MIN_PLAYERS) return "You need at least "+MIN_PLAYERS+" players.";
  if(c.wolves<1) return "You need at least one werewolf.";
  if(c.wolves*2>=n) return "Too many werewolves: they must start as fewer than half of the players.";
  if(c.wolves+(c.seer?1:0)+(c.doctor?1:0)>n) return "Not enough players for these roles.";
  return "";
}
function startGame(){
  const g=S.hostGame, c=g.config, n=g.players.length;
  const err=setupError(); if(err){ S.err=err; render(); return; }
  const roles=[]; for(let i=0;i<c.wolves;i++) roles.push("wolf");
  if(c.seer) roles.push("seer"); if(c.doctor) roles.push("doctor");
  while(roles.length<n) roles.push("villager");
  shuffle(roles);
  const map={}; g.players.forEach((p,i)=>{ map[p.id]=roles[i]; p.alive=true; delete p.role; });
  g.gameId=rid();
  S.hs={gameId:g.gameId, roles:map, actions:{}, seer:[], lastProtected:null};
  const vill=n-c.wolves-(c.seer?1:0)-(c.doctor?1:0);
  const t="A new game begins with "+n+" players: "+c.wolves+" werewol"+(c.wolves>1?"ves":"f")+(c.seer?", a Seer":"")+(c.doctor?", a Doctor":"")+" and "+vill+" villager"+(vill===1?"":"s")+".";
  Object.assign(g,{status:"night", round:1, nightIn:[], votes:{}, winner:null, timerEnd:null, announce:"Night 1. Check your role in secret, then make your night choice.", log:[{r:0,k:"start",t}]});
  S.nightPick=null; S.showRole=false;
  narrate("Night falls on the village. Everyone, check your role in secret, then make your night choice on your phone.");
  changed();
}
function nextNight(){
  const g=S.hostGame; g.round++; S.hs.actions[g.round]={};
  Object.assign(g,{status:"night", nightIn:[], votes:{}, timerEnd:null, announce:"Night "+g.round+". Make your night choice in secret."});
  S.nightPick=null;
  narrate("Night falls again. Everyone, make your night choice on your phone.");
  changed();
}
function openVote(){ Object.assign(S.hostGame,{status:"vote", votes:{}, timerEnd:null, announce:"Voting is open. Choose who to eliminate, or skip."}); narrate("Discussion is over. Voting is now open."); changed(); }
function playAgain(){
  const g=S.hostGame;
  g.players=g.players.filter(p=>p.id===S.pid || S.conns[p.id]).map(p=>({id:p.id,name:p.name,alive:true}));
  if(g.config.wolvesAuto) g.config.wolves=defaultWolves(g.players.length);
  S.hs={gameId:rid(), roles:{}, actions:{}, seer:[], lastProtected:null};
  Object.assign(g,{status:"lobby", round:0, gameId:S.hs.gameId, log:[], nightIn:[], votes:{}, winner:null, timerEnd:null, announce:""});
  S.nightPick=null; S.showRole=false;
  changed();
}
function endGame(){
  const g=S.hostGame; if(g.status==="over") return;
  g.players.forEach(p=>p.role=S.hs.roles[p.id]);
  Object.assign(g,{status:"over", winner:"none", announce:"The host ended the game."});
  changed();
}

/* =========================================================
   PLAYER
   ========================================================= */
function joinGame(code){
  code=(code||"").toUpperCase().trim();
  if(!/^[A-Z]{4}$/.test(code)){ S.err="Enter the 4-letter room code."; render(); return; }
  if(!S.name.trim()){ S.err="Enter your name first."; render(); return; }
  if(!peerOk()){ S.err="The connection library did not load. Check your internet connection and reload."; render(); return; }
  const saved=LS.get("ww:host");
  if(saved && saved.code===code){ return resumeHost(); }
  S.code=code; S.isHost=false; S.busy=true; S.status="Connecting to room "+code+"…"; render();
  LS.set("ww:last", code);
  try{ location.hash=code; }catch(e){}
  if(!S.peer || S.peer.destroyed){
    const peer=new Peer();
    S.peer=peer;
    peer.on("open", ()=>connectToHost());
    peer.on("disconnected", ()=>{ setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} }, 1500); });
    peer.on("error", err=>{
      if(err.type==="peer-unavailable"){
        if(S.game){ scheduleReconnect(); return; }   // host briefly away during a game: keep trying
        S.err=peerErrorText(err); leaveLocal(false); return;
      }
      if(!S.game){ S.err=peerErrorText(err); leaveLocal(false); }
      else scheduleReconnect();
    });
  } else connectToHost();
}
function connectToHost(){
  if(!S.code || S.isHost) return;
  if(S.conn){ try{ S.conn.close(); }catch(e){} }
  const conn=S.peer.connect(PEER_PREFIX+S.code, {reliable:true});
  S.conn=conn;
  conn.on("open", ()=>{
    S.connected=true; S.reconnecting=false; S.busy=false; S.status="";
    send(conn,{t:"join", pid:S.pid, name:S.name.trim()});
    render();
  });
  conn.on("data", d=>{
    if(!d) return;
    if(d.t==="state"){
      const prev=S.game;
      S.game=d.game; S.inbox=d.me;
      if(!prev || prev.status!==d.game.status || prev.round!==d.game.round) S.nightPick=null;
      if(prev && prev.gameId!==d.game.gameId) S.showRole=false;
      render();
    } else if(d.t==="reject"){ S.err=d.msg||"The host did not let you in."; leaveLocal(false); }
  });
  conn.on("close", ()=>{ if(S.conn===conn){ S.connected=false; scheduleReconnect(); render(); } });
  conn.on("error", ()=>{});
}
let reconTimer=null;
function scheduleReconnect(){
  if(!S.code || S.isHost) return;
  S.connected=false; S.reconnecting=true; render();
  clearTimeout(reconTimer);
  reconTimer=setTimeout(()=>{
    if(!S.code || S.isHost || S.connected) return;
    if(!S.peer || S.peer.destroyed){ joinGame(S.code); return; }
    if(S.peer.disconnected){ try{ S.peer.reconnect(); }catch(e){} }
    connectToHost();
  }, 2500);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  if(S.isHost){ keepAwake(); if(S.peer && S.peer.disconnected){ try{ S.peer.reconnect(); }catch(e){} } }
  else if(S.code && !S.connected) scheduleReconnect();
});

function submitNight(target){
  const g=S.game; if(!g || g.status!=="night") return;
  S.nightPick={round:g.round, target};
  const msg={t:"night", round:g.round, gameId:g.gameId, target};
  if(S.isHost) handleNight(S.pid, msg); else send(S.conn, msg);
  render();
}
function submitVote(target){
  const g=S.game; if(!g || g.status!=="vote") return;
  const msg={t:"vote", round:g.round, gameId:g.gameId, target};
  if(S.isHost) handleVote(S.pid, msg); else { send(S.conn, msg); S.pendingVote={round:g.round,target}; }
  render();
}
function myVote(){
  const g=S.game; if(!g) return null;
  if(g.votes && g.votes[S.pid]) return g.votes[S.pid];
  return (S.pendingVote && S.pendingVote.round===g.round) ? S.pendingVote.target : null;
}

function leaveLocal(clearHost){
  if(S.conn && S.conn.open && !S.isHost) send(S.conn,{t:"leave"});
  const peer=S.peer;
  setTimeout(()=>{ try{ peer && peer.destroy(); }catch(e){} }, 150);
  clearTimeout(reconTimer);
  if(clearHost) LS.del("ww:host");
  if(!S.isHost) LS.del("ww:last");
  Object.assign(S,{peer:null, conn:null, conns:{}, code:null, game:null, hostGame:null, hs:null, inbox:null, isHost:false,
    connected:false, reconnecting:false, busy:false, status:"", nightPick:null, showRole:false, pendingVote:null});
  try{ if(S.wakeLock){ S.wakeLock.release(); S.wakeLock=null; } }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  render();
}

/* =========================================================
   UI
   ========================================================= */
const ACT = {
  create:v=>createGame(v),
  join:()=>joinGame(S.codeInput),
  rejoin:v=>joinGame(v),
  resume:()=>resumeHost(),
  forget:()=>{ LS.del("ww:host"); render(); },
  rules:()=>{ S.showRules=true; render(); },
  closeRules:()=>{ S.showRules=false; render(); },
  dismiss:()=>{ S.err=""; render(); },
  toggleRole:()=>{ S.showRole=!S.showRole; render(); },
  toggleLog:()=>{ S.showLog=!S.showLog; render(); },
  night:v=>submitNight(v),
  vote:v=>submitVote(v),
  leave:()=>leaveLocal(false),
  closeRoom:()=>leaveLocal(true),
  kick:v=>{ const g=S.hostGame; g.players=g.players.filter(p=>p.id!==v); if(g.config.wolvesAuto) g.config.wolves=defaultWolves(g.players.length); const c=S.conns[v]; send(c,{t:"reject", msg:"The host removed you from the room."}); delete S.conns[v]; changed(); },
  wolves:v=>{ const c=S.hostGame.config; c.wolves=Math.max(1,Math.min(5,c.wolves+Number(v))); c.wolvesAuto=false; changed(); },
  cfg:v=>{ const c=S.hostGame.config; c[v]=!c[v]; changed(); },
  voice:()=>{ S.voiceOn=!S.voiceOn; if(S.voiceOn) narrate("Voice narration is on."); else { try{speechSynthesis.cancel()}catch(e){} } render(); },
  start:()=>startGame(),
  endNight:()=>{ resolveNight(); },
  openVote:()=>openVote(),
  closeVote:()=>resolveVote(),
  timer:v=>{ S.hostGame.timerEnd = v==="0"?null:Date.now()+Number(v)*1000; changed(); },
  nextNight:()=>nextNight(),
  again:()=>playAgain(),
  endGame:()=>endGame(),
  copyLink:async()=>{ try{ await navigator.clipboard.writeText(location.origin+location.pathname+"#"+S.code); S.status="Link copied."; render(); setTimeout(()=>{S.status="";render();},1500);}catch(e){} }
};
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  if(b.classList.contains("overlay") && e.target!==b) return;
  const f=ACT[b.dataset.act]; if(f) f(b.dataset.v==="__null"?null:b.dataset.v, b);
});
document.addEventListener("input", e=>{
  if(e.target.id==="name"){ S.name=e.target.value.slice(0,24); LS.set("ww:name",S.name); }
  if(e.target.id==="code"){ S.codeInput=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4); e.target.value=S.codeInput; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="code") joinGame(S.codeInput); });
setInterval(()=>{
  const el=document.getElementById("timer"); const g=S.game;
  if(!el || !g || !g.timerEnd) return;
  const s=Math.max(0,Math.round((g.timerEnd-Date.now())/1000));
  el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  if(s===0 && !el.dataset.done){ el.dataset.done="1"; if(S.isHost) narrate("Time is up."); }
}, 500);

function render(){
  const g=S.game;
  document.body.classList.toggle("day", !!g && ["day","vote","dusk"].includes(g.status));
  let html;
  if(!S.code || !g){
    html = S.busy ? `<div class="wrap"><div class="moon">🌕</div><h1>Werewolf</h1><p class="center muted">${esc(S.status||"Connecting…")}</p><button class="block ghost" data-act="leave">Cancel</button></div>` : viewHome();
  } else if(g.status==="lobby") html=viewLobby();
  else html=viewGame();
  if(S.showRules) html+=viewRules();
  const app=document.getElementById("app");
  const active=document.activeElement && document.activeElement.id;
  app.innerHTML=html;
  if(active){ const el=document.getElementById(active); if(el){ el.focus(); try{ const l=el.value.length; el.setSelectionRange(l,l);}catch(e){} } }
}
function errBox(){ return S.err?`<div class="err"><div class="grow">${esc(S.err)}</div><button class="ghost small" data-act="dismiss">✕</button></div>`:""; }
function connBanner(){
  if(S.isHost) return "";
  if(S.reconnecting || !S.connected) return `<div class="banner">Reconnecting to the host… Keep this page open.</div>`;
  return "";
}

function viewHome(){

  ${errBox()}

    <div class="row"><button class="grow primary" data-act="resume">Reopen room</button><button class="ghost" data-act="forget">Discard</button></div></div>`:""}
  <div class="card"><h3>Your name</h3>
    <input id="name" type="text" maxlength="24" placeholder="e.g. Mei Ling" value="${esc(S.name)}" autocomplete="off"></div>

    <button class="block primary" data-act="create" data-v="app">I will play too · app narrates</button>

    <button class="block" data-act="create" data-v="mod">I will moderate · not playing</button>

function viewLobby(){
  const g=S.game, c=g.config, n=g.players.length, isHost=S.isHost;
  const vill=n-c.wolves-(c.seer?1:0)-(c.doctor?1:0);
  const setupErr=isHost?setupError():"";
  return `<div class="wrap">
  <div class="phase"><span class="title">Lobby</span><button class="ghost small" data-act="${isHost?"closeRoom":"leave"}">${isHost?"Close room":"Leave"}</button></div>
  ${connBanner()}${errBox()}
  <div class="card center">
    <div class="muted small">Room code</div>
    <div class="bigcode">${esc(g.code)}</div>
    <div class="muted small">Everyone opens this page and enters the code.${g.mode==="mod"?" Moderator: "+esc(g.hostName)+".":""}</div>
    ${isHost?`<button class="ghost small" style="margin-top:8px" data-act="copyLink">${S.status||"Copy invite link"}</button>`:""}
  </div>
  <div class="card players"><h3>Players (${n})</h3>
    ${n?g.players.map(p=>`<div class="p"><span>${esc(p.name)}${p.id===S.pid?' <span class="tag">you</span>':""}${p.id===g.host?' <span class="tag">host</span>':""}${isHost&&p.id!==S.pid&&!S.conns[p.id]?' <span class="tag">offline</span>':""}</span>
      ${isHost&&p.id!==S.pid?`<button class="ghost small" data-act="kick" data-v="${esc(p.id)}">Remove</button>`:""}</div>`).join(""):`<p class="muted">Nobody has joined yet.</p>`}
  </div>

    <div class="toggle"><span>🐺 Werewolves</span><div class="stepper"><button data-act="wolves" data-v="-1">−</button><b>${c.wolves}</b><button data-act="wolves" data-v="1">+</button></div></div>
    <div class="toggle"><span>🔮 Seer</span><button class="switch ${c.seer?"on":""}" data-act="cfg" data-v="seer" aria-label="Seer"></button></div>
    <div class="toggle"><span>💉 Doctor</span><button class="switch ${c.doctor?"on":""}" data-act="cfg" data-v="doctor" aria-label="Doctor"></button></div>
    <div class="toggle"><span>Reveal a player's role when they die</span><button class="switch ${c.reveal?"on":""}" data-act="cfg" data-v="reveal" aria-label="Reveal roles"></button></div>

function phaseTitle(g){ return {night:"Night "+g.round, day:"Day "+g.round, vote:"Vote · Day "+g.round, dusk:"Dusk · Day "+g.round, over:"Game over"}[g.status]||""; }
function viewGame(){
  const g=S.game, isMod=g.mode==="mod" && S.isHost;
  const me=g.players.find(p=>p.id===S.pid);
  const timer=g.timerEnd && g.timerEnd>Date.now() && ["day","vote"].includes(g.status)?`<div class="card"><div class="timer" id="timer">…</div></div>`:"";
  let h=`<div class="wrap">
  <div class="phase"><span class="title">${g.status==="night"?"🌙 ":g.status==="over"?"":"☀️ "}${phaseTitle(g)}</span>
    <span class="row">${S.isHost?`<button class="ghost small" data-act="voice">${S.voiceOn?"🔊":"🔇"}</button>`:""}<button class="ghost small" data-act="rules">?</button></span></div>
  <div class="muted small">Room ${esc(g.code)}${me?" · "+esc(me.name):isMod?" · Moderator":""}</div>
  ${connBanner()}${errBox()}
  ${g.announce?`<div class="banner">${esc(g.announce)}</div>`:""}
  ${timer}`;
  if(g.status==="over") h+=viewOver();
  else if(isMod) h+=viewModerator();
  else if(!me) h+=`<div class="card"><p class="muted">You are watching this game. You can join the next one.</p></div>`;
  else { h+=roleCard(); h+=actionPanel(me); }
  h+=playersList()+logView();
  h+=S.isHost?`<button class="block ghost small" data-act="closeRoom">Close room</button></div>`:`<button class="block ghost small" data-act="leave">Leave game</button></div>`;
  if(S.isHost) h+=hostBar();
  return h;
}
function myInbox(){ const g=S.game, m=S.inbox; return (m && g && m.gameId===g.gameId)?m:null; }
function roleCard(){
  const m=myInbox();
  if(!m) return `<div class="card center muted">Receiving your secret role…</div>`;
  const R=ROLE[m.role];
  if(!S.showRole) return `<div class="card rolecard" data-act="toggleRole"><div class="icon">🂠</div><div class="muted">Tap to see your secret role</div></div>`;
  let extra="";
  if(m.role==="wolf"){ const o=(m.wolves||[]).filter(id=>id!==S.pid); extra=o.length?`<p class="small">Your pack: ${o.map(id=>esc(nameOf(id))).join(", ")}</p>`:`<p class="small">You are the only werewolf.</p>`; }
  if(m.role==="seer" && m.seer && m.seer.length) extra=`<p class="small">Your visions: ${m.seer.map(s=>esc(nameOf(s.target))+(s.wolf?" 🐺 werewolf":" ✓ not a werewolf")).join(" · ")}</p>`;
  return `<div class="card rolecard" data-act="toggleRole"><div class="icon">${R.icon}</div><div class="name">${R.name}</div>
    <span class="tag ${R.team==="wolves"?"wolf":"good"}">${R.team==="wolves"?"Werewolf team":"Village team"}</span>
    <p class="small muted">${R.desc}</p>${extra}<div class="small muted">Tap to hide</div></div>`;
}
function actionPanel(me){
  const g=S.game, m=myInbox();
  if(!me.alive) return `<div class="card"><h3>You are out</h3><p class="muted">Stay quiet and enjoy watching. No hints to the living.</p></div>`;
  if(g.status==="night"){
    if(!m) return "";
    const living=g.players.filter(p=>p.alive);
    const local=S.nightPick && S.nightPick.round===g.round;
    const picked=local?S.nightPick.target:(m.round===g.round?m.mine:null);
    const hasPicked=local || (m.round===g.round && m.mine!=null);
    const count=`<p class="small muted center">${(g.nightIn||[]).length} of ${living.length} players have chosen.</p>`;
    const btn=(p,label,disabled,note)=>`<button class="pick ${picked===p.id?"sel":""}" data-act="night" data-v="${esc(p.id)}" ${disabled?"disabled":""}><span>${esc(label||p.name)}</span><span class="small muted">${note||""}</span></button>`;
    if(m.role==="wolf"){
      const picks=m.picks||{};
      const targets=living.filter(p=>!(m.wolves||[]).includes(p.id));
      return `<div class="card"><h3>🐺 Choose your victim</h3><p class="small muted">All living werewolves must agree before the night ends. You see each other's picks here.</p>
        ${targets.map(p=>{ const who=Object.entries(picks).filter(([w,t])=>t===p.id).map(([w])=>w===S.pid?"you":nameOf(w)); return btn(p,null,false,who.length?"🐺 "+esc(who.join(", ")):""); }).join("")}${count}</div>`;
    }
    if(m.role==="seer"){
      const res=(m.seer||[]).find(s=>s.round===g.round);
      if(res) return `<div class="card"><h3>🔮 Your vision</h3><div class="result">${esc(nameOf(res.target))} ${res.wolf?"<b style='color:var(--wolf)'>is a werewolf</b> 🐺":"is <b style='color:var(--good)'>not a werewolf</b>"}</div><p class="small muted center">Keep this to yourself, or use it wisely by day.</p>${count}</div>`;
      if(hasPicked) return `<div class="card"><h3>🔮 Looking into the crystal…</h3><p class="muted">Your vision of ${esc(nameOf(picked))} is on its way.</p>${count}</div>`;
      return `<div class="card"><h3>🔮 Choose someone to inspect</h3><p class="small muted">Your choice is final for tonight.</p>${living.filter(p=>p.id!==S.pid).map(p=>btn(p)).join("")}${count}</div>`;
    }
    if(m.role==="doctor"){
      return `<div class="card"><h3>💉 Choose someone to protect</h3><p class="small muted">You can change your choice until the night ends.</p>
        ${living.map(p=>btn(p,p.id===S.pid?p.name+" (yourself)":p.name,p.id===m.lastProtected,p.id===m.lastProtected?"protected last night":"")).join("")}${count}</div>`;
    }
    return `<div class="card"><h3>🌙 Who do you suspect?</h3><p class="small muted">Villagers have no night power. Pick anyone: it has no effect, but it keeps everyone tapping so nobody can tell roles apart.</p>
      ${living.filter(p=>p.id!==S.pid).map(p=>btn(p)).join("")}${count}</div>`;
  }
  if(g.status==="day") return `<div class="card"><h3>☀️ Discuss</h3><p class="muted">Talk it over. Who is lying? The host will open voting when the village is ready.</p></div>`;
  if(g.status==="vote"){
    const living=g.players.filter(p=>p.alive), mv=myVote(), votes=g.votes||{};
    const cnt=t=>Object.values(votes).filter(x=>x===t).length;
    return `<div class="card"><h3>🗳️ Vote to eliminate</h3><p class="small muted">Votes are public. You can change yours until voting closes. A tie means nobody is eliminated.</p>
      ${living.filter(p=>p.id!==S.pid).map(p=>`<button class="pick ${mv===p.id?"sel":""}" data-act="vote" data-v="${esc(p.id)}"><span>${esc(p.name)}</span><span class="small muted">${cnt(p.id)?cnt(p.id)+" vote"+(cnt(p.id)>1?"s":""):""}</span></button>`).join("")}
      <button class="pick ${mv==="skip"?"sel":""}" data-act="vote" data-v="skip"><span>Skip (no elimination)</span><span class="small muted">${cnt("skip")||""}</span></button>
      <p class="small muted center">${Object.keys(votes).length} of ${living.length} have voted.</p></div>`;
  }
  if(g.status==="dusk") return `<div class="card"><p class="muted">The sun is setting. Waiting for the host to begin the next night.</p></div>`;
  return "";
}
function viewModerator(){
  const g=S.game, hs=S.hs||{roles:{},actions:{},seer:[]}, A=(hs.actions||{})[g.round]||{};
  const script={
    night:"“Night falls. Everyone, look at your phone and make your choice in secret. Werewolves, agree on a victim. Seer, choose someone to inspect. Doctor, choose someone to protect.”",
    day:"“Morning comes. "+esc((g.announce||"").replace(/^Night \d+: /,""))+" Discuss who you suspect.”",
    vote:"“Voting is open. Choose who to eliminate on your phone, or skip.”",
    dusk:"“"+esc((g.announce||"").replace(/^Day \d+: /,""))+" Night is coming.”"
  }[g.status]||"";
  const act=p=>{
    if(!p.alive || g.status!=="night") return "";
    const a=A[p.id]; if(!a) return '<span class="muted">waiting</span>';
    const r=hs.roles[p.id];
    if(r==="villager") return '<span class="muted">chose (no effect)</span>';
    let s={wolf:"kill",seer:"inspect",doctor:"protect"}[r]+" "+esc(nameOf(a.target));
    if(r==="seer"){ const res=hs.seer.find(x=>x.round===g.round); if(res) s+=res.wolf?" → 🐺":" → not wolf"; }
    return s;
  };
  return `<div class="card"><h3>📜 Say this</h3><p>${script}</p></div>
  <div class="card"><h3>Moderator view <span class="tag">secret</span></h3>
  <table class="modtable">${g.players.map(p=>{const R=ROLE[hs.roles[p.id]];return `<tr class="${p.alive?"":"dead"}"><td>${esc(p.name)}${S.conns[p.id]?"":' <span class="tag">offline</span>'}</td><td>${R?R.icon+" "+R.name:"?"}</td><td>${act(p)}</td></tr>`;}).join("")}</table>
  ${g.status==="night"?`<p class="small muted">The Doctor cannot protect: ${hs.lastProtected?esc(nameOf(hs.lastProtected)):"nobody"}.</p>`:""}</div>`;
}
function viewOver(){
  const g=S.game;
  const title=g.winner==="village"?"🏡 The village wins":g.winner==="wolves"?"🐺 The werewolves win":"Game ended";
  return `<div class="card center"><h2>${title}</h2>
  ${g.players.map(p=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span class="${p.alive?"":"dead"}">${esc(p.name)}</span><span>${p.role?ROLE[p.role].icon+" "+ROLE[p.role].name:""}</span></div>`).join("")}</div>
  ${S.isHost?"":`<p class="center muted small">Waiting for the host to start another round.</p>`}`;
}
function playersList(){
  const g=S.game; if(g.status==="over") return "";
  return `<div class="card players"><h3>Village (${g.players.filter(p=>p.alive).length} alive)</h3>
  ${g.players.map(p=>`<div class="p"><span class="${p.alive?"":"dead"}">${esc(p.name)}${p.id===S.pid?' <span class="tag">you</span>':""}</span>
  <span>${p.role?`<span class="tag ${p.role==="wolf"?"wolf":""}">${ROLE[p.role].icon} ${ROLE[p.role].name}</span>`:""}${!p.alive?' <span class="tag">dead</span>':""}${g.status==="vote"&&p.alive&&(g.votes||{})[p.id]?' <span class="tag good">voted</span>':""}${S.isHost&&p.id!==S.pid&&!S.conns[p.id]?' <span class="tag">offline</span>':""}</span></div>`).join("")}</div>`;
}
function logView(){
  const g=S.game; if(!g.log||!g.log.length) return "";
  return `<div class="card log"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Village record</h3><button class="ghost small" data-act="toggleLog">${S.showLog?"Hide":"Show"}</button></div>
  ${S.showLog?g.log.slice().reverse().map(l=>`<div>${esc(l.t)}${l.d?`<div class="small muted">${esc(l.d)}</div>`:""}</div>`).join(""):""}</div>`;
}
function hostBar(){
  const g=S.game, living=g.players.filter(p=>p.alive);
  let inner="";
  if(g.status==="night"){
    const n=(g.nightIn||[]).length, split=new Set(wolfPicks()).size>1;
    inner=`<div class="small muted center" style="margin-bottom:8px">${n} of ${living.length} have chosen${split?" · werewolves have not agreed yet":""}${g.mode==="app"&&n===living.length&&!split?" · ending night…":""}</div>
    <button class="block ${n===living.length?"primary":""}" data-act="endNight">End night now</button>`;
  } else if(g.status==="day"){
    const on=g.timerEnd&&g.timerEnd>Date.now();
    inner=`<div class="row"><button class="grow" data-act="timer" data-v="${on?"0":"180"}">${on?"Stop timer":"3-min timer"}</button><button class="grow primary" data-act="openVote">Open voting</button></div>`;
  } else if(g.status==="vote"){
    const n=Object.keys(g.votes||{}).length;
    inner=`<div class="small muted center" style="margin-bottom:8px">${n} of ${living.length} have voted</div><button class="block ${n===living.length?"primary":""}" data-act="closeVote">Close voting now</button>`;
  } else if(g.status==="dusk"){
    inner=`<button class="block primary" data-act="nextNight">Begin night ${g.round+1}</button>`;
  } else if(g.status==="over"){
    inner=`<button class="block primary" data-act="again">Back to lobby · play again</button>`;
  }
  if(g.status!=="over") inner+=`<button class="block ghost small" style="margin-top:6px" data-act="endGame">End game</button>`;
  return `<div class="hostbar"><div class="inner">${inner}</div></div>`;
}
function viewRules(){
  return `<div class="overlay" data-act="closeRules"><div class="sheet">
  <h2>How to play</h2>
  <ol>
  <li><b>Setup.</b> One person hosts and gets a 4-letter code. Everyone else opens this page on their own phone and joins with that code. Sit together in the same room.</li>
  <li><b>Roles.</b> Each player gets a secret role: 🐺 Werewolf, 🔮 Seer, 💉 Doctor or 🧑‍🌾 Villager. Werewolves know each other. Nobody else knows anything.</li>
  <li><b>Night.</b> Everyone taps a choice on their phone in secret. Werewolves agree on a victim. The Seer learns whether one player is a werewolf. The Doctor protects one player. Villagers tap a decoy choice so nobody can tell who is doing what.</li>
  <li><b>Day.</b> The village learns who died. Everyone discusses, accuses and defends. Werewolves pretend to be villagers.</li>
  <li><b>Vote.</b> Everyone left alive votes to eliminate one player, or skips. Most votes is eliminated. A tie means nobody goes.</li>
  <li><b>Winning.</b> The village wins when every werewolf is gone. The werewolves win when they equal or outnumber everyone else.</li>
  </ol>
  <p class="small muted">The host's phone is the game server, so the host must keep this page open and the screen on until the game ends. If a player's phone sleeps, they reconnect automatically when they open the page again.</p>
  <button class="block primary" data-act="closeRules">Got it</button></div></div>`;
}
</script>
</body>
</html>
